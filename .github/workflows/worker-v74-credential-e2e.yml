name: KUEPER Worker V7.4 Privileged Credential E2E

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Apply or clean up the harmless workflow marker on the dedicated smoke branch
        required: true
        type: choice
        options:
          - apply
          - cleanup
        default: apply

permissions:
  contents: read

concurrency:
  group: kueper-worker-v74-privileged-e2e
  cancel-in-progress: false

jobs:
  privileged-push-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KUEPER_BOT_TOKEN: ${{ secrets.KUEPER_BOT_TOKEN }}
      KUEPER_WORKFLOW_TOKEN: ${{ secrets.KUEPER_WORKFLOW_TOKEN }}
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v6

      - name: Verify dedicated credentials exist
        shell: bash
        run: |
          set -euo pipefail
          for name in KUEPER_BOT_TOKEN KUEPER_WORKFLOW_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing required secret::$name is empty or unavailable"
              exit 1
            fi
          done

      - name: Run deterministic V7.4 privileged push E2E
        run: python tools/worker/v74_privileged_e2e.py --mode "${{ inputs.mode }}"

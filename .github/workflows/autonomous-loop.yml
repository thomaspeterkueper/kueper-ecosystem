name: KUEPER Autonomous Ecosystem Loop

on:
  workflow_dispatch:
    inputs:
      max_tasks:
        description: Maximum tasks to execute in this sweep
        required: false
        default: "3"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: kueper-autonomous-ecosystem-loop
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KUEPER_BOT_TOKEN: ${{ secrets.KUEPER_BOT_TOKEN }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      ANTHROPIC_BASE_URL: "https://api.deepseek.com/anthropic"
      ANTHROPIC_AUTH_TOKEN: ${{ secrets.DEEPSEEK_API_KEY }}
      ANTHROPIC_MODEL: "deepseek-v4-flash"
      ANTHROPIC_DEFAULT_OPUS_MODEL: "deepseek-v4-pro[1m]"
      ANTHROPIC_DEFAULT_SONNET_MODEL: "deepseek-v4-flash"
      ANTHROPIC_DEFAULT_HAIKU_MODEL: "deepseek-v4-flash"
      KUEPER_MAX_TASKS: ${{ inputs.max_tasks || '3' }}
      KUEPER_MAX_FOLLOWUPS: "10"
      KUEPER_MAX_FOLLOWUP_DEPTH: "3"
      KUEPER_MAX_EXTERNAL_INGEST: "5"
      KUEPER_MAX_PARKED_REEVALUATIONS: "3"
      KUEPER_PARKED_AGENT_CMD: claude -p --dangerously-skip-permissions
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code agent frontend
        run: npm install --global @anthropic-ai/claude-code

      - name: Verify configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in KUEPER_BOT_TOKEN DEEPSEEK_API_KEY SUPABASE_URL SUPABASE_SECRET_KEY; do
            test -n "${!name:-}" || { echo "Missing $name"; exit 2; }
          done
          claude --version
          gh --version

      - name: Re-evaluate parked tasks
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/loop/reevaluate_parked.py | tee ecosystem-parked-report.json

      - name: Route project follow-up requests
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/loop/route_followups.py | tee ecosystem-routing-report.json

      - name: Ingest open external tasks into task bus
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/loop/ingest_external_tasks.py | tee ecosystem-external-ingest-report.json

      - name: Consume routed outbox envelopes
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/loop/cleanup_outbox.py | tee ecosystem-outbox-cleanup-report.json

      - name: Upload loop reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecosystem-loop-report-${{ github.run_id }}
          path: |
            ecosystem-parked-report.json
            ecosystem-routing-report.json
            ecosystem-external-ingest-report.json
            ecosystem-outbox-cleanup-report.json
          if-no-files-found: ignore
          retention-days: 30

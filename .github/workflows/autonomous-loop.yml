name: KUEPER Autonomous Ecosystem Loop

on:
  workflow_dispatch:
    inputs:
      max_tasks:
        description: Maximum tasks to execute in this sweep
        required: false
        default: "3"
  push:
    branches:
      - main
    paths:
      - ".kueper/outbox/**"
      - "tools/loop/**"
      - ".github/workflows/autonomous-loop.yml"
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read

concurrency:
  group: kueper-autonomous-ecosystem-loop
  cancel-in-progress: false

# Seit 13.11.2026 (Thomas): nur noch deterministisches Routing der Outboxes.
# Bearbeitung, Parked-Neubewertung, PR-Review und Recherche machen Claude-Läufe,
# siehe docs/operations/claude-laeufe.md. Kein Sprachmodell mehr in diesem Workflow.
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KUEPER_BOT_TOKEN: ${{ secrets.KUEPER_BOT_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      KUEPER_MAX_TASKS: ${{ inputs.max_tasks || '3' }}
      KUEPER_MAX_FOLLOWUPS: "10"
      KUEPER_MAX_FOLLOWUP_DEPTH: "3"
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in KUEPER_BOT_TOKEN; do
            test -n "${!name:-}" || { echo "Missing $name"; exit 2; }
          done
          gh --version

      - name: Test external task ingestion parser
        run: python3 -m unittest tools/loop/test_ingest_external_tasks.py

      - name: Route project follow-up requests
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/loop/route_followups.py | tee ecosystem-routing-report.json

      - name: Consume routed outbox envelopes
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/loop/cleanup_outbox.py | tee ecosystem-outbox-cleanup-report.json

      - name: Upload loop reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecosystem-loop-report-${{ github.run_id }}
          path: |
            ecosystem-parked-report.json
            ecosystem-routing-report.json
            ecosystem-external-ingest-report.json
            ecosystem-outbox-cleanup-report.json
          if-no-files-found: ignore
          retention-days: 30

name: KUEPER Targeted Research

on:
  workflow_dispatch:
    inputs:
      research_ids:
        description: "Comma-separated queued research IDs"
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - "research/targeted-request.json"

permissions:
  contents: read

concurrency:
  group: kueper-targeted-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      KUEPER_BOT_TOKEN: ${{ secrets.KUEPER_BOT_TOKEN }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      ANTHROPIC_BASE_URL: "https://api.deepseek.com/anthropic"
      ANTHROPIC_AUTH_TOKEN: ${{ secrets.DEEPSEEK_API_KEY }}
      ANTHROPIC_MODEL: "deepseek-v4-flash"
      ANTHROPIC_DEFAULT_OPUS_MODEL: "deepseek-v4-pro[1m]"
      ANTHROPIC_DEFAULT_SONNET_MODEL: "deepseek-v4-flash"
      ANTHROPIC_DEFAULT_HAIKU_MODEL: "deepseek-v4-flash"
      KUEPER_RESEARCH_AGENT_CMD: node ${{ github.workspace }}/tools/research/agent-with-exa.mjs
      KUEPER_SYNTHESIS_AGENT_BIN: claude
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4

      - name: Resolve targeted research IDs
        shell: bash
        env:
          DISPATCH_IDS: ${{ github.event.inputs.research_ids }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ids="$DISPATCH_IDS"
          else
            ids="$(python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('research/targeted-request.json').read_text(encoding='utf-8'))
          ids=data.get('research_ids') or []
          if isinstance(ids,str):
              print(ids)
          else:
              print(','.join(str(x) for x in ids))
          PY
          )"
          fi
          test -n "$ids" || { echo "No targeted research IDs resolved"; exit 2; }
          echo "KUEPER_RESEARCH_IDS=$ids" >> "$GITHUB_ENV"
          echo "Targeted IDs: $ids"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code agent frontend
        run: npm install --global @anthropic-ai/claude-code

      - name: Install AI Gateway research tooling
        run: npm install --no-save --package-lock=false ai@6.0.0

      - name: Verify configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KUEPER_BOT_TOKEN" || { echo "Missing KUEPER_BOT_TOKEN"; exit 2; }
          test -n "$DEEPSEEK_API_KEY" || { echo "Missing DEEPSEEK_API_KEY"; exit 2; }
          test -n "$AI_GATEWAY_API_KEY" || { echo "Missing AI_GATEWAY_API_KEY"; exit 2; }
          test -n "$KUEPER_RESEARCH_IDS" || { echo "Missing KUEPER_RESEARCH_IDS"; exit 2; }
          python3 -m py_compile tools/research/execute.py tools/research/execute-targeted.py
          node --check tools/research/agent-with-exa.mjs
          claude --version
          node --version

      - name: Research selected queued topics
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/research/execute-targeted.py | tee targeted-research-report.json

      - name: Upload research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: targeted-research-${{ github.run_id }}
          path: targeted-research-report.json
          if-no-files-found: ignore
          retention-days: 30

name: Review head dedup tests

on:
  pull_request:
    paths:
      - 'tools/review/pr_review_agent_v08.py'
      - 'tools/review/test_pr_review_agent_v08.py'
      - '.github/workflows/review-head-dedup-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

# Cancel only an older validation of the same PR. Manual diagnostic runs
# and different PRs must never cancel one another.
concurrency:
  group: review-head-dedup-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile reviewer modules
        run: python -m compileall -q tools/review
      - name: Run review head dedup regression tests
        run: python -m unittest discover -s tools/review -p 'test_pr_review_agent_v08.py' -v

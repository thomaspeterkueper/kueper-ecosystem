name: Energy research pilot tests
on:
  pull_request:
    paths:
      - 'research/energy-pilot/**'
      - '.github/workflows/energy-research.yml'
  push:
    branches:
      - 'research/energy-pilot-v1'
    paths:
      - 'research/energy-pilot/**'
      - '.github/workflows/energy-research.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test research/energy-pilot/*.test.mjs

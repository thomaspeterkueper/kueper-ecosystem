name: KUEPER Governance Sweep

on:
  workflow_dispatch: {}
  schedule:
    - cron: "5 6 * * *"

permissions:
  contents: write

concurrency:
  group: kueper-governance-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KUEPER_BOT_TOKEN: ${{ secrets.KUEPER_BOT_TOKEN }}
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4

      - name: Run governance sweep
        run: python3 tools/governance/sweep.py

      - name: Commit updated report
        run: |
          set -euo pipefail
          git config user.name "KUEPER Governance Sweep Bot"
          git config user.email "governance-sweep-bot@users.noreply.github.com"
          git add -A status/governance-sweep.json status/governance-sweep.md external-tasks
          if git diff --cached --quiet; then
            echo "No change in report."
          else
            git commit -m "chore(governance-sweep): update report $(date -u +%Y-%m-%d)"
            git push
          fi

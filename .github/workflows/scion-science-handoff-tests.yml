name: SCION science handoff regression

on:
  pull_request:
    paths:
      - 'tools/loop/test_scion_science_handoff.py'
      - '.github/workflows/scion-science-handoff-tests.yml'
  push:
    branches: [main]
    paths:
      - 'tools/loop/test_scion_science_handoff.py'
      - '.github/workflows/scion-science-handoff-tests.yml'

permissions:
  contents: read

jobs:
  science-handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools/loop -p 'test_scion_science_handoff.py' -v

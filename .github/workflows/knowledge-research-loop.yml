name: KUEPER Knowledge Research Loop

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"
  push:
    branches:
      - main
    paths:
      - "research/triggers/knowledge-research-loop.txt"

permissions:
  contents: read

concurrency:
  group: kueper-knowledge-research-loop
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      KUEPER_BOT_TOKEN: ${{ secrets.KUEPER_BOT_TOKEN }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      ANTHROPIC_BASE_URL: "https://api.deepseek.com/anthropic"
      ANTHROPIC_AUTH_TOKEN: ${{ secrets.DEEPSEEK_API_KEY }}
      ANTHROPIC_MODEL: "deepseek-v4-flash"
      ANTHROPIC_DEFAULT_OPUS_MODEL: "deepseek-v4-pro[1m]"
      ANTHROPIC_DEFAULT_SONNET_MODEL: "deepseek-v4-flash"
      ANTHROPIC_DEFAULT_HAIKU_MODEL: "deepseek-v4-flash"
      KUEPER_DISCOVERY_AGENT_CMD: claude -p --dangerously-skip-permissions
      KUEPER_RESEARCH_AGENT_CMD: node ${{ github.workspace }}/tools/research/agent-with-exa.mjs
      KUEPER_SYNTHESIS_AGENT_BIN: claude
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code agent frontend
        run: npm install --global @anthropic-ai/claude-code

      - name: Install optional AI Gateway research tooling
        continue-on-error: true
        run: npm install --no-save --package-lock=false ai@6.0.0

      - name: Verify configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KUEPER_BOT_TOKEN" || { echo "Missing KUEPER_BOT_TOKEN"; exit 2; }
          test -n "$DEEPSEEK_API_KEY" || { echo "Missing DEEPSEEK_API_KEY"; exit 2; }
          if [ -z "$AI_GATEWAY_API_KEY" ]; then
            echo "::warning::AI_GATEWAY_API_KEY is not configured; Exa external evidence will fall back to the existing live-search path."
          fi
          claude --version
          node --version

      - name: Validate research control plane
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool research/policy.json >/dev/null
          python3 -m py_compile tools/research/discover.py tools/research/execute.py tools/research/validate_ota_pilot.py
          python3 tools/research/validate_ota_pilot.py
          node --check tools/research/agent-with-exa.mjs

      - name: Discover one project's highest-value research gaps
        run: python3 tools/research/discover.py | tee research-discovery-report.json

      - name: Research queued topics
        run: python3 tools/research/execute.py | tee research-execution-report.json

      - name: Upload research reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-loop-${{ github.run_id }}
          path: |
            research-discovery-report.json
            research-execution-report.json
          if-no-files-found: ignore
          retention-days: 30

name: KUEPER Workflow Credential Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify privileged token can push a workflow mutation
        shell: bash
        env:
          KUEPER_WORKFLOW_TOKEN: ${{ secrets.KUEPER_WORKFLOW_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${KUEPER_WORKFLOW_TOKEN:-}"

          actor="$(curl -fsSL \
            -H "Authorization: Bearer ${KUEPER_WORKFLOW_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user | python -c 'import json,sys; print(json.load(sys.stdin).get("login", "<unknown>"))')"
          echo "KUEPER_WORKFLOW_TOKEN authenticates as: ${actor}"

          git config --local --unset-all http.https://github.com/.extraheader || true
          git config --local --remove-section credential || true
          git config --global --unset-all http.https://github.com/.extraheader || true
          git config --global --remove-section credential || true

          git config user.name "kueper-workflow-smoke"
          git config user.email "workflow-smoke@users.noreply.github.com"

          git switch -C test/workflow-credential-smoke
          cat > .github/workflows/_credential-smoke-target.yml <<'YAML'
          name: Credential Smoke Target
          on:
            workflow_dispatch:
          jobs:
            noop:
              runs-on: ubuntu-latest
              steps:
                - run: echo "workflow credential smoke test"
          YAML

          git add .github/workflows/_credential-smoke-target.yml
          git commit -m "test: verify privileged workflow credential"

          git -c credential.helper= push --force \
            "https://x-access-token:${KUEPER_WORKFLOW_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/heads/test/workflow-credential-smoke

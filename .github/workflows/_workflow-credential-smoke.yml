name: KUEPER Workflow Credential Smoke Test

on:
  push:
    branches:
      - feat/privileged-workflow-credential
    paths:
      - .github/workflows/_workflow-credential-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify privileged token can push a workflow mutation
        shell: bash
        env:
          KUEPER_WORKFLOW_TOKEN: ${{ secrets.KUEPER_WORKFLOW_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${KUEPER_WORKFLOW_TOKEN:-}"

          git config user.name "kueper-workflow-smoke"
          git config user.email "workflow-smoke@users.noreply.github.com"

          git switch -C test/workflow-credential-smoke
          cat > .github/workflows/_credential-smoke-target.yml <<'YAML'
          name: Credential Smoke Target
          on:
            workflow_dispatch:
          jobs:
            noop:
              runs-on: ubuntu-latest
              steps:
                - run: echo "workflow credential smoke test"
          YAML

          git add .github/workflows/_credential-smoke-target.yml
          git commit -m "test: verify privileged workflow credential"
          git push --force "https://x-access-token:${KUEPER_WORKFLOW_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/test/workflow-credential-smoke

name: KUEPER Automated PR Review

on:
  workflow_dispatch:
    inputs:
      max_reviews:
        description: Maximum review_pending PRs for this run
        required: false
        default: "3"
      scheduler_run_id:
        description: Supabase scheduler run UUID; leave empty for manual/fallback runs
        required: false
        default: ""
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read

concurrency:
  group: kueper-pr-review-agent
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      KUEPER_BOT_TOKEN: ${{ secrets.KUEPER_BOT_TOKEN }}
      KUEPER_MAX_REVIEWS: ${{ inputs.max_reviews || '3' }}
    steps:
      - name: Checkout trusted control plane
        uses: actions/checkout@v6

      - name: Acquire scheduler execution lease
        id: lease
        shell: bash
        env:
          SCHEDULER_RUN_ID: ${{ inputs.scheduler_run_id || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          source_name="manual"
          if [ "$EVENT_NAME" = "schedule" ]; then
            source_name="github_schedule"
          elif [ -n "$SCHEDULER_RUN_ID" ]; then
            source_name="supabase"
          fi
          python3 tools/scheduler/run_guard.py acquire \
            --worker pr-review-agent \
            --scheduler-run-id "$SCHEDULER_RUN_ID" \
            --source "$source_name"

      - name: Explain duplicate skip
        if: steps.lease.outputs.should_run != 'true'
        run: |
          echo "Scheduler guard skipped this execution: ${{ steps.lease.outputs.skip_reason }}"

      - name: Set up Python
        if: steps.lease.outputs.should_run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node
        if: steps.lease.outputs.should_run == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install Claude Code reviewer frontend
        if: steps.lease.outputs.should_run == 'true'
        run: npm install --global @anthropic-ai/claude-code

      - name: Verify required secrets
        if: steps.lease.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in SUPABASE_URL SUPABASE_SECRET_KEY DEEPSEEK_API_KEY KUEPER_BOT_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing GitHub Actions secret::$name is empty or unavailable to this workflow"
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Test scheduler guard
        if: steps.lease.outputs.should_run == 'true'
        run: python -m unittest tools/scheduler/test_run_guard.py

      - name: Run deterministic reviewer schema, transport and intake tests
        if: steps.lease.outputs.should_run == 'true'
        run: |
          python -m unittest tools/review/test_pr_review_agent.py
          python -m unittest tools/review/test_pr_review_agent_v02.py
          python -m unittest tools/review/test_pr_review_agent_v03.py
          python -m unittest tools/review/test_pr_review_agent_v04.py
          python -m unittest tools/review/test_direct_pr_intake.py
          python -m unittest tools/review/test_direct_pr_intake_v02.py

      - name: Discover direct PRs from registry
        if: steps.lease.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python tools/review/direct_pr_intake_v02.py --discover --max-prs 50 | tee direct-pr-intake-report.json

      - name: Review bounded pending PR batch
        if: steps.lease.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python tools/review/pr_review_agent_v04.py --max-reviews "$KUEPER_MAX_REVIEWS" | tee pr-review-report.json

      - name: Finish scheduler heartbeat
        if: always() && steps.lease.outputs.should_run == 'true'
        shell: bash
        run: |
          python3 tools/scheduler/run_guard.py finish \
            --run-id "${{ steps.lease.outputs.scheduler_run_id }}" \
            --lease-token "${{ steps.lease.outputs.lease_token }}" \
            --status "${{ job.status }}" \
            --github-run-id "${{ github.run_id }}"

      - name: Upload review reports
        if: always() && steps.lease.outputs.should_run == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: pr-review-${{ github.run_id }}
          path: |
            direct-pr-intake-report.json
            pr-review-report.json
          if-no-files-found: ignore
          retention-days: 30

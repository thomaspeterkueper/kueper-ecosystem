name: KUEPER Canon Conflict Loop

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * *"

permissions:
  contents: read

concurrency:
  group: kueper-canon-conflict-loop
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KUEPER_BOT_TOKEN: ${{ secrets.KUEPER_BOT_TOKEN }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      ANTHROPIC_BASE_URL: "https://api.deepseek.com/anthropic"
      ANTHROPIC_AUTH_TOKEN: ${{ secrets.DEEPSEEK_API_KEY }}
      ANTHROPIC_MODEL: "deepseek-v4-flash"
      ANTHROPIC_DEFAULT_OPUS_MODEL: "deepseek-v4-pro[1m]"
      ANTHROPIC_DEFAULT_SONNET_MODEL: "deepseek-v4-flash"
      ANTHROPIC_DEFAULT_HAIKU_MODEL: "deepseek-v4-flash"
      KUEPER_MAX_CANDIDATE_VALIDATIONS: "3"
      KUEPER_VALIDATION_AGENT_CMD: claude -p --dangerously-skip-permissions
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code agent frontend
        run: npm install --global @anthropic-ai/claude-code

      - name: Verify configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KUEPER_BOT_TOKEN" || { echo "Missing KUEPER_BOT_TOKEN"; exit 2; }
          test -n "$DEEPSEEK_API_KEY" || { echo "Missing DEEPSEEK_API_KEY"; exit 2; }
          claude --version

      - name: Validate merged research candidates against consumer projects
        run: python3 tools/research/validate_candidates.py | tee canon-conflict-report.json

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canon-conflict-${{ github.run_id }}
          path: canon-conflict-report.json
          if-no-files-found: ignore
          retention-days: 30

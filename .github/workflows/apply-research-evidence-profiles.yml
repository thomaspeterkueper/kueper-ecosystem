name: Apply Research Evidence Profiles

# One-time migration trigger. Remove this workflow after successful application.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-research-evidence-profiles.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply migration
        run: python tools/maintenance/apply-research-evidence-profiles.py

      - name: Validate JSON and source syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool research/policy.json >/dev/null
          python -m json.tool registry/projects.json >/dev/null
          python -m py_compile tools/research/discover.py tools/research/execute.py
          node --check tools/research/agent-with-exa.mjs

      - name: Commit migration result
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No migration changes required"
            exit 0
          fi
          git config user.name "KUEPER Maintenance Bot"
          git config user.email "maintenance-bot@users.noreply.github.com"
          git add registry/projects.json research/policy.json tools/research/discover.py tools/research/execute.py tools/research/agent-with-exa.mjs docs/research-evidence-profiles.md
          git commit -m "research: add project-specific evidence profiles"
          git push origin HEAD:main
